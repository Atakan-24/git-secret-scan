[project]
name = "git-secret-scan"
version = "1.1.0"
description = "Dependency-free pre-commit hook that stops credentials reaching a git commit"
requires-python = ">=3.9"
dependencies = []                 # deliberately none — see README

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "coverage>=7", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["scan", "install"]
branch = true

[tool.coverage.report]
# The tool's own job is to have no gaps; enforce that in CI rather than
# tracking a number in a README that quietly rots.
fail_under = 80
show_missing = true
exclude_lines = ["if __name__ == .__main__.:", "raise SystemExit"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = [
    "S603",   # subprocess call — this tool exists to shell out to git
    "S607",   # partial path for `git` — resolving it would break PATH setups
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]              # asserts are the point of a test file
