name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The tool is pure standard library and installs as a git hook on
  # whatever machine a developer happens to use. That claim is only worth
  # something if it is tested on more than one of them.
  test:
    name: py${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.9', '3.13']
        include:
          - os: ubuntu-latest
            python: '3.11'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dev dependencies
        run: python -m pip install --quiet pytest hypothesis coverage ruff

      - name: Configure git
        # The end-to-end tests create real repositories and real commits.
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "ci"
          git config --global init.defaultBranch main

      - name: Test with coverage
        run: python -m coverage run -m pytest

      - name: Coverage report (fails under 80%)
        run: python -m coverage report

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --quiet ruff
      - run: python -m ruff check .

  benchmark:
    name: precision / recall gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # Fails the build if precision or recall drops below 95%. A
      # regression in a security tool is a silent one, so it needs a gate
      # rather than a number someone remembers to look at.
      - run: python benchmark/measure.py

  dogfood:
    name: scans itself
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # --history needs the full object store
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Scan tracked files
        run: python scan.py --tracked
      - name: Scan the entire history
        run: python scan.py --history

  action:
    name: the action runs itself
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Uses the action from this checkout rather than a published tag, so
      # a change to action.yml is tested by the same commit that makes it.
      - name: Scan this change with the action
        uses: ./
        id: clean
        with:
          mode: changes

      - name: The clean run must report zero findings
        run: |
          test "${{ steps.clean.outputs.findings }}" = "0" \
            || { echo "expected 0, got ${{ steps.clean.outputs.findings }}"; exit 1; }

      # The important half: prove it actually fails when it should. An
      # action that has only ever been observed passing is untested.
      - name: Plant a synthetic credential
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'tests')
          from fixtures.synthetic_secrets import SYNTHETIC
          open('planted.py', 'wb').write(b'KEY = "' + SYNTHETIC['AWS access key id'] + b'"\n')
          PY
          git config user.email ci@example.invalid
          git config user.name ci
          git add planted.py
          git commit -q -m "planted credential (test)"

      - name: The action must now fail
        uses: ./
        id: planted
        continue-on-error: true
        with:
          mode: changes

      - name: Verify it failed and counted the finding
        run: |
          test "${{ steps.planted.outcome }}" = "failure" \
            || { echo "the action passed on a planted credential"; exit 1; }
          test "${{ steps.planted.outputs.findings }}" = "1" \
            || { echo "expected 1 finding, got ${{ steps.planted.outputs.findings }}"; exit 1; }
          echo "Correctly blocked a planted credential and reported 1 finding."
